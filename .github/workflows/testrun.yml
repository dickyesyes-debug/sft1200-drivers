name: Build SFT1200 OpenWrt Firmware & WWAN Drivers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  compile-drivers:
    runs-on: ubuntu-22.04

    steps:
    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo docker image prune --all --force
        sudo apt-get clean

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Prepare Ubuntu 20.04 Build Container
      run: |
        docker run -dit --name openwrt_build ubuntu:20.04 /bin/bash
        docker exec openwrt_build apt-get update
        docker exec openwrt_build env DEBIAN_FRONTEND=noninteractive apt-get install -y \
          build-essential python2 python3 git curl wget unzip libncurses5-dev zlib1g-dev gawk flex gettext file

    - name: Setup siflower-1806 SDK & Fix Makefile Errors
      run: |
        docker exec openwrt_build /bin/bash -c "
          # 獲取 GL.iNet 官方源碼
          git clone -b openwrt-18.06-siflower https://github.com/gl-inet/openwrt.git /openwrt
          cd /openwrt
          
          # 更新 feeds
          ./scripts/feeds update -a
          
          # 剔除 gli_pub 中造成解析崩潰的損壞套件
          rm -rf feeds/gli_pub/luci-proto-wwan
          rm -rf feeds/gli_pub/luci-proto-qcm
          rm -rf feeds/gli_pub/luci-proto-callip
          rm -rf feeds/gli_pub/luci-proto-directip
          
          # 注入 OpenWrt 官方 18.06 版本的正常協議套件
          mkdir -p package/custom_wwan
          git clone --depth 1 -b openwrt-18.06 https://github.com/openwrt/luci.git /tmp/luci_src
          cp -r /tmp/luci_src/protocols/luci-proto-wwan package/custom_wwan/
          cp -r /tmp/luci_src/protocols/luci-proto-qmi package/custom_wwan/
          cp -r /tmp/luci_src/protocols/luci-proto-mbim package/custom_wwan/
          
          # 重新建立安裝清單
          ./scripts/feeds install -a -f
        "

    - name: Inject DW5821e & L850-GL Drivers to .config
      run: |
        docker exec openwrt_build /bin/bash -c "
          cd /openwrt
          make defconfig
          
          # 寫入 L850-GL (MBIM) 與 DW5821e (QMI/MBIM) 所需的核心模組與撥號工具
          cat <<EOF >> .config
          CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=y
          CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=y
          CONFIG_PACKAGE_kmod-usb-net-qmi-wwan=y
          CONFIG_PACKAGE_kmod-usb-serial-wwan=y
          CONFIG_PACKAGE_kmod-usb-serial-option=y
          CONFIG_PACKAGE_usb-modeswitch=y
          CONFIG_PACKAGE_luci-proto-wwan=y
          CONFIG_PACKAGE_luci-proto-qmi=y
          CONFIG_PACKAGE_luci-proto-mbim=y
          CONFIG_PACKAGE_uqmi=y
          CONFIG_PACKAGE_umbim=y
          CONFIG_PACKAGE_comgt=y
          CONFIG_PACKAGE_chat=y
          # SFT1200 硬體目標設定
          CONFIG_TARGET_siflower=y
          CONFIG_TARGET_siflower_sf19a28=y
          CONFIG_TARGET_siflower_sf19a28_DEVICE_gl-sft1200=y
          EOF
          
          make defconfig
        "

    - name: Compile OpenWrt Packages
      run: |
        docker exec openwrt_build /bin/bash -c "
          cd /openwrt
          # 啟用單執行緒 (V=s) 輸出詳細日誌方便排錯，若確認無誤可改為 -j\$(nproc)
          make -j1 V=s
        "

    - name: Extract and Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: sft1200-wwan-drivers
        path: |
          # 抓取編譯出的 ipk 與韌體
          /openwrt/bin/packages/**/luci-proto-*.ipk
          /openwrt/bin/packages/**/kmod-usb-*.ipk
          /openwrt/bin/targets/*/*/*.bin
