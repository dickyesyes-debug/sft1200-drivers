
name: SFT1200 Non Root Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Check Runner
        run: |
          echo "Workflow started"
          id
          df -h

      - name: Check Builder
        run: |
          sudo useradd -m -s /bin/bash builder
          sudo -u builder bash -c 'id'
          sudo -u builder bash -c 'echo BUILD_OK'
