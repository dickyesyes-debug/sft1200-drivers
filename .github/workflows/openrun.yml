
name: SFT1200 Non Root 4G 5G Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      SDK_ROOT: /home/builder/gl_sdk/sdk/1806/siflower
      HOME: /home/builder
      BUILD_JOBS: 2

    steps:

      - name: Free Disk Space
        run: |
          set -eux

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium

          df -h

      - name: Install Dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc g++ binutils \
            ccache ecj fastjar file \
            gawk gettext git subversion \
            libncurses5-dev libz-dev \
            patch python3 python3-pip \
            unzip zlib1g-dev libssl-dev \
            libglib2.0-dev xsltproc \
            libxml2-utils bc tmux quilt \
            time rsync wget curl perl \
            flex bison gperf make tar \
            xz-utils jq cpio libelf-dev

      - name: Create Builder
        run: |
          set -eux

          sudo useradd -m -s /bin/bash builder || true

          sudo mkdir -p /home/builder

          sudo chown -R builder:builder /home/builder

          id builder

          test "$(id -u builder)" -ne 0

      - name: Download GL SDK
        run: |
          set -eux

          sudo -u builder bash <<'BUILDER'

          cd /home/builder

          git clone \
            --depth 1 \
            https://github.com/gl-inet/sdk.git \
            gl_sdk

          cd gl_sdk

          ./download.sh siflower-1806

          test -d sdk/1806/siflower

          BUILDER

      - name: Configure Modem Feed
        run: |
          set -eux

          sudo -u builder env SDK_ROOT="$SDK_ROOT" bash <<'BUILDER'

          cd "$SDK_ROOT"

          if ! grep -q 'modemfeed' feeds.conf.default; then
            echo 'src-git modemfeed https://github.com/koshev-msk/modemfeed.git' >> feeds.conf.default
          fi

          ./scripts/feeds update -a

          ./scripts/feeds install -a

          echo "Modem feed installed"

          BUILDER

      - name: Import XMM Protocol
        run: |
          set -eux

          sudo -u builder env SDK_ROOT="$SDK_ROOT" bash <<'BUILDER'

          cd "$SDK_ROOT"

          XMM_FILE=$(find package feeds \
            -type f \
            -path '*/luci-proto-xmm/Makefile' \
            -print -quit 2>/dev/null || true)

          if [ -z "$XMM_FILE" ]; then
            echo "luci-proto-xmm is not present in the available feeds."
            echo "The modemfeed source must not be assumed to contain this package."
            echo "Stopping before configuration to prevent a false successful build."
            exit 1
          fi

          echo "Found: $XMM_FILE"

          BUILDER

      - name: Configure Packages
        run: |
          set -eux

          sudo -u builder env SDK_ROOT="$SDK_ROOT" bash <<'BUILDER'

          cd "$SDK_ROOT"

          make defconfig

          PACKAGES="
          luci-proto-xmm
          usb-modeswitch
          kmod-usb-net-cdc-mbim
          kmod-usb-net-cdc-ncm
          kmod-usb-serial-option
          kmod-usb-serial
          kmod-usb-serial-wwan
          kmod-usb-net
          kmod-usb-wdm
          "

          for package in $PACKAGES; do
            sed -i "/^CONFIG_PACKAGE_${package}=/d" .config
            echo "CONFIG_PACKAGE_${package}=m" >> .config
          done

          make defconfig

          for package in $PACKAGES; do
            grep -Fx "CONFIG_PACKAGE_${package}=m" .config
          done

          cp .config /home/builder/sft1200.config

          BUILDER

      - name: Compile XMM Protocol
        run: |
          set -eux

          sudo -u builder env SDK_ROOT="$SDK_ROOT" bash <<'BUILDER'

          cd "$SDK_ROOT"

          make -j2 package/luci-proto-xmm/compile V=s

          BUILDER

      - name: Compile USB Mode Switch
        run: |
          set -eux

          sudo -u builder env SDK_ROOT="$SDK_ROOT" bash <<'BUILDER'

          cd "$SDK_ROOT"

          make -j2 package/usb-modeswitch/compile V=s

          BUILDER

      - name: Compile USB Kernel Modules
        run: |
          set -eux

          sudo -u builder env SDK_ROOT="$SDK_ROOT" bash <<'BUILDER'

          cd "$SDK_ROOT"

          make -j2 package/kernel/linux/compile V=s

          BUILDER

      - name: Collect IPK
        run: |
          set -eux

          sudo mkdir -p /home/builder/artifacts

          sudo chown -R builder:builder /home/builder/artifacts

          sudo -u builder env SDK_ROOT="$SDK_ROOT" bash <<'BUILDER'

          cd "$SDK_ROOT"

          DEST=/home/builder/artifacts

          PACKAGES="
          luci-proto-xmm
          usb-modeswitch
          kmod-usb-net-cdc-mbim
          kmod-usb-net-cdc-ncm
          kmod-usb-serial-option
          kmod-usb-serial
          kmod-usb-serial-wwan
          kmod-usb-net
          kmod-usb-wdm
          "

          for package in $PACKAGES; do
            find bin -type f \
              -name "${package}_*.ipk" \
              -exec cp -f {} "$DEST/" \; \
              2>/dev/null || true
          done

          cp /home/builder/sft1200.config "$DEST/"

          cd "$DEST"

          sha256sum *.ipk > SHA256SUMS

          ls -lh

          BUILDER

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SFT1200-4G-5G-IPK
          path: /home/builder/artifacts/
          if-no-files-found: error
          retention-days: 30

      - name: Build Report
        if: always()
        run: |
          df -h
          id builder
