
name: Build SFT1200 Drivers Non Root

on:
  workflow_dispatch:
    inputs:
      xmm_repo:
        description: Git repository containing luci-proto-xmm
        required: true
        type: string
      xmm_branch:
        description: XMM branch
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    container:
      image: ubuntu:20.04

    timeout-minutes: 360

    env:
      DEBIAN_FRONTEND: noninteractive
      TZ: Asia/Taipei
      BUILD_JOBS: 2
      SDK_DIR: gl_sdk/sdk/1806/siflower

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install System Dependencies
        shell: bash
        run: |
          set -eux

          apt-get update

          apt-get install -y \
            sudo \
            tzdata \
            git \
            ca-certificates \
            python2 \
            python3 \
            python3-pip \
            python3-setuptools \
            build-essential \
            gcc \
            g++ \
            binutils \
            ccache \
            ecj \
            fastjar \
            file \
            gawk \
            gettext \
            subversion \
            libncurses5-dev \
            libz-dev \
            patch \
            unzip \
            zlib1g-dev \
            libssl-dev \
            libglib2.0-dev \
            xsltproc \
            libxml2-utils \
            bc \
            tmux \
            quilt \
            time \
            rsync \
            wget \
            curl \
            perl \
            flex \
            bison \
            gperf \
            make \
            tar \
            xz-utils \
            jq \
            findutils

          ln -sf /usr/share/zoneinfo/Asia/Taipei /etc/localtime

          dpkg-reconfigure --frontend noninteractive tzdata

          python2 --version
          python3 --version

          df -h

      - name: Create Non Root Builder
        shell: bash
        run: |
          set -eux

          if ! id builder >/dev/null 2>&1; then
            useradd -m -s /bin/bash builder
          fi

          mkdir -p /home/builder

          chown -R builder:builder /home/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

          chmod 755 /home/builder

          id builder

          if [ "$(id -u builder)" -eq 0 ]; then
            echo "Builder cannot be root"
            exit 1
          fi

      - name: Clone GL.iNet SDK
        shell: bash
        run: |
          set -eux

          runuser -u builder -- env \
            HOME=/home/builder \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            bash -e -c '
              cd "$GITHUB_WORKSPACE"

              git clone \
                --depth 1 \
                https://github.com/gl-inet/sdk.git \
                gl_sdk

              cd gl_sdk

              ./download.sh siflower-1806
            '

      - name: Import XMM Protocol
        shell: bash
        env:
          XMM_REPO: ${{ inputs.xmm_repo }}
          XMM_BRANCH: ${{ inputs.xmm_branch }}
        run: |
          set -eux

          if [ -z "$XMM_REPO" ]; then
            echo "XMM repository is required"
            exit 1
          fi

          runuser -u builder -- env \
            HOME=/home/builder \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            XMM_REPO="$XMM_REPO" \
            XMM_BRANCH="$XMM_BRANCH" \
            bash -e -c '
              cd "$GITHUB_WORKSPACE"

              git clone \
                --depth 1 \
                --branch "$XMM_BRANCH" \
                "$XMM_REPO" \
                /home/builder/xmm-source

              if [ -f /home/builder/xmm-source/protocols/luci-proto-xmm/Makefile ]; then
                SOURCE=/home/builder/xmm-source/protocols/luci-proto-xmm
              elif [ -f /home/builder/xmm-source/luci-proto-xmm/Makefile ]; then
                SOURCE=/home/builder/xmm-source/luci-proto-xmm
              elif [ -f /home/builder/xmm-source/Makefile ]; then
                SOURCE=/home/builder/xmm-source
              else
                echo "luci-proto-xmm Makefile not found"
                exit 1
              fi

              mkdir -p gl_sdk/sdk/1806/siflower/package/custom

              cp -a "$SOURCE" \
                gl_sdk/sdk/1806/siflower/package/custom/luci-proto-xmm

              cat > gl_sdk/sdk/1806/siflower/package/custom/Makefile <<EOF
          include \$(sort \$(wildcard \$(CURDIR)/*/Makefile))
          EOF
            '

      - name: Update and Install Feeds
        shell: bash
        run: |
          set -eux

          runuser -u builder -- env \
            HOME=/home/builder \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            bash -e -c '
              cd "$GITHUB_WORKSPACE/gl_sdk/sdk/1806/siflower"

              ./scripts/feeds update -a

              ./scripts/feeds install -a
            '

      - name: Verify SDK and Package
        shell: bash
        run: |
          set -eux

          runuser -u builder -- env \
            HOME=/home/builder \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            bash -e -c '
              cd "$GITHUB_WORKSPACE/gl_sdk/sdk/1806/siflower"

              test -f Makefile
              test -f package/custom/luci-proto-xmm/Makefile

              echo "SDK verification passed"

              id
            '

      - name: Configure Modular Packages
        shell: bash
        run: |
          set -eux

          runuser -u builder -- env \
            HOME=/home/builder \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            bash -e -c '
              cd "$GITHUB_WORKSPACE/gl_sdk/sdk/1806/siflower"

              make defconfig

              PACKAGES="
              luci-proto-xmm
              usb-modeswitch
              kmod-usb-net-cdc-mbim
              kmod-usb-net-cdc-ncm
              kmod-usb-serial-option
              kmod-usb-serial
              kmod-usb-serial-wwan
              kmod-usb-net
              kmod-usb-wdm
              "

              for package in $PACKAGES; do
                sed -i "/^CONFIG_PACKAGE_${package}=/d" .config
                echo "CONFIG_PACKAGE_${package}=m" >> .config
              done

              make defconfig

              for package in $PACKAGES; do
                if ! grep -Fxq "CONFIG_PACKAGE_${package}=m" .config; then
                  echo "Package unavailable: $package"
                  exit 1
                fi
              done

              cp .config "$GITHUB_WORKSPACE/sft1200.config"

              echo "Modular configuration completed"
            '

      - name: Build XMM Protocol
        shell: bash
        run: |
          set -eux

          runuser -u builder -- env \
            HOME=/home/builder \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            bash -e -c '
              cd "$GITHUB_WORKSPACE/gl_sdk/sdk/1806/siflower"

              make -j2 package/luci-proto-xmm/compile V=s
            '

      - name: Build USB Mode Switch
        shell: bash
        run: |
          set -eux

          runuser -u builder -- env \
            HOME=/home/builder \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            bash -e -c '
              cd "$GITHUB_WORKSPACE/gl_sdk/sdk/1806/siflower"

              make -j2 package/usb-modeswitch/compile V=s
            '

      - name: Build USB Kernel Modules
        shell: bash
        run: |
          set -eux

          runuser -u builder -- env \
            HOME=/home/builder \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            bash -e -c '
              cd "$GITHUB_WORKSPACE/gl_sdk/sdk/1806/siflower"

              make -j2 package/kernel/linux/compile V=s
            '

      - name: Verify Builder Ownership
        shell: bash
        run: |
          set -eux

          if [ "$(id -u builder)" -eq 0 ]; then
            echo "Invalid builder account"
            exit 1
          fi

          runuser -u builder -- bash -c '
            cd "$GITHUB_WORKSPACE/gl_sdk/sdk/1806/siflower"

            test -w .
            test -w build_dir 2>/dev/null || true

            echo "Build ownership verified"
          '

      - name: Collect IPK Packages
        shell: bash
        run: |
          set -eux

          mkdir -p "$RUNNER_TEMP/ipk-artifacts"

          chown -R builder:builder "$RUNNER_TEMP/ipk-artifacts"

          runuser -u builder -- env \
            HOME=/home/builder \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            bash -e -c '
              cd "$GITHUB_WORKSPACE/gl_sdk/sdk/1806/siflower"

              DEST="$RUNNER_TEMP/ipk-artifacts"

              PACKAGES="
              luci-proto-xmm
              usb-modeswitch
              kmod-usb-net-cdc-mbim
              kmod-usb-net-cdc-ncm
              kmod-usb-serial-option
              kmod-usb-serial
              kmod-usb-serial-wwan
              kmod-usb-net
              kmod-usb-wdm
              "

              for package in $PACKAGES; do
                find bin -type f \
                  -name "${package}_*.ipk" \
                  -exec cp -f {} "$DEST/" \; \
                  2>/dev/null || true
              done

              for package in $PACKAGES; do
                if ! find "$DEST" \
                  -maxdepth 1 \
                  -name "${package}_*.ipk" \
                  -print -quit | grep -q .; then

                  echo "Missing package: $package"
                  exit 1
                fi
              done

              cp "$GITHUB_WORKSPACE/sft1200.config" "$DEST/"

              cd "$DEST"

              sha256sum *.ipk > SHA256SUMS

              printf "%s\n" \
                "GL-SFT1200" \
                "Siflower 18.06" \
                "mipsel_24kc" \
                > BUILD_INFO.txt

              ls -lh
            '

      - name: Upload IPK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SFT1200-NonRoot-Drivers
          path: ${{ runner.temp }}/ipk-artifacts/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Disk Report
        if: always()
        shell: bash
        run: |
          df -h
          echo "Non-root build finished"
