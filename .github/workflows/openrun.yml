
name: SFT1200 Non Root Driver Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      TZ: Asia/Taipei
      SDK_DIR: gl_sdk/sdk/1806/siflower
      BUILD_JOBS: 2

    steps:

      - name: Clean Disk Space
        shell: bash
        run: |
          set -eux

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium

          df -h

      - name: Install Dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            binutils \
            ccache \
            ecj \
            fastjar \
            file \
            gawk \
            gettext \
            git \
            subversion \
            libncurses5-dev \
            libz-dev \
            patch \
            python3 \
            python3-pip \
            python3-setuptools \
            unzip \
            zlib1g-dev \
            libssl-dev \
            libglib2.0-dev \
            xsltproc \
            libxml2-utils \
            bc \
            tmux \
            quilt \
            time \
            rsync \
            wget \
            curl \
            perl \
            flex \
            bison \
            gperf \
            make \
            tar \
            xz-utils \
            jq \
            cpio \
            libelf-dev \
            device-tree-compiler

          sudo ln -sf /usr/share/zoneinfo/Asia/Taipei /etc/localtime

          df -h

      - name: Create Builder User
        shell: bash
        run: |
          set -eux

          if ! id builder >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash builder
          fi

          sudo mkdir -p /home/builder

          sudo chown -R builder:builder /home/builder

          sudo chown -R builder:builder "$GITHUB_WORKSPACE"

          if [ "$(id -u builder)" -eq 0 ]; then
            echo "ERROR: Builder is root"
            exit 1
          fi

          id builder

      - name: Clone GL.iNet SDK
        shell: bash
        run: |
          set -eux

          sudo -u builder env \
            HOME=/home/builder \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            bash -euo pipefail <<'BUILDER'

          cd "$GITHUB_WORKSPACE"

          git clone --depth 1 \
            https://github.com/gl-inet/sdk.git \
            gl_sdk

          cd gl_sdk

          ./download.sh siflower-1806

          cd sdk/1806/siflower

          test -f Makefile
          test -d package
          test -d target

          echo "SDK download successful"

          BUILDER

      - name: Check XMM Package
        shell: bash
        run: |
          set -eux

          sudo -u builder env \
            HOME=/home/builder \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            SDK_DIR="$SDK_DIR" \
            bash -euo pipefail <<'BUILDER'

          cd "$GITHUB_WORKSPACE/$SDK_DIR"

          XMM_MAKEFILE=$(find package feeds -type f \
            -path '*/luci-proto-xmm/Makefile' \
            -print -quit 2>/dev/null || true)

          if [ -z "$XMM_MAKEFILE" ]; then
            echo "ERROR: luci-proto-xmm not found in SDK"
            echo "The real XMM source repository is required."
            exit 1
          fi

          echo "Found XMM package:"
          echo "$XMM_MAKEFILE"

          BUILDER

      - name: Update Feeds
        shell: bash
        run: |
          set -eux

          sudo -u builder env \
            HOME=/home/builder \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            SDK_DIR="$SDK_DIR" \
            bash -euo pipefail <<'BUILDER'

          cd "$GITHUB_WORKSPACE/$SDK_DIR"

          ./scripts/feeds update -a

          ./scripts/feeds install -a

          BUILDER

      - name: Configure SFT1200 Packages
        shell: bash
        run: |
          set -eux

          sudo -u builder env \
            HOME=/home/builder \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            SDK_DIR="$SDK_DIR" \
            bash -euo pipefail <<'BUILDER'

          cd "$GITHUB_WORKSPACE/$SDK_DIR"

          if [ ! -f .config ]; then
            make defconfig
          fi

          PACKAGES="
          luci-proto-xmm
          usb-modeswitch
          kmod-usb-net-cdc-mbim
          kmod-usb-net-cdc-ncm
          kmod-usb-serial-option
          kmod-usb-serial
          kmod-usb-serial-wwan
          kmod-usb-net
          kmod-usb-wdm
          "

          for package in $PACKAGES; do
            sed -i "/^CONFIG_PACKAGE_${package}=/d" .config
            echo "CONFIG_PACKAGE_${package}=m" >> .config
          done

          make defconfig

          for package in $PACKAGES; do
            if ! grep -Fxq "CONFIG_PACKAGE_${package}=m" .config; then
              echo "ERROR: Package configuration failed: $package"
              exit 1
            fi
          done

          cp .config "$GITHUB_WORKSPACE/sft1200.config"

          echo "Configuration completed"

          BUILDER

      - name: Build XMM Protocol
        shell: bash
        run: |
          set -eux

          sudo -u builder env \
            HOME=/home/builder \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            SDK_DIR="$SDK_DIR" \
            bash -euo pipefail <<'BUILDER'

          cd "$GITHUB_WORKSPACE/$SDK_DIR"

          make -j2 package/luci-proto-xmm/compile V=s

          BUILDER

      - name: Build USB Mode Switch
        shell: bash
        run: |
          set -eux

          sudo -u builder env \
            HOME=/home/builder \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            SDK_DIR="$SDK_DIR" \
            bash -euo pipefail <<'BUILDER'

          cd "$GITHUB_WORKSPACE/$SDK_DIR"

          make -j2 package/usb-modeswitch/compile V=s

          BUILDER

      - name: Build USB Kernel Modules
        shell: bash
        run: |
          set -eux

          sudo -u builder env \
            HOME=/home/builder \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            SDK_DIR="$SDK_DIR" \
            bash -euo pipefail <<'BUILDER'

          cd "$GITHUB_WORKSPACE/$SDK_DIR"

          make -j2 package/kernel/linux/compile V=s

          BUILDER

      - name: Collect IPK Packages
        shell: bash
        run: |
          set -eux

          sudo mkdir -p "$RUNNER_TEMP/ipk-artifacts"

          sudo chown builder:builder "$RUNNER_TEMP/ipk-artifacts"

          sudo -u builder env \
            HOME=/home/builder \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            SDK_DIR="$SDK_DIR" \
            bash -euo pipefail <<'BUILDER'

          cd "$GITHUB_WORKSPACE/$SDK_DIR"

          DEST="$RUNNER_TEMP/ipk-artifacts"

          PACKAGES="
          luci-proto-xmm
          usb-modeswitch
          kmod-usb-net-cdc-mbim
          kmod-usb-net-cdc-ncm
          kmod-usb-serial-option
          kmod-usb-serial
          kmod-usb-serial-wwan
          kmod-usb-net
          kmod-usb-wdm
          "

          for package in $PACKAGES; do

            find bin -type f \
              -name "${package}_*.ipk" \
              -exec cp -f {} "$DEST/" \; \
              2>/dev/null || true

          done

          for package in $PACKAGES; do

            if ! find "$DEST" -maxdepth 1 \
              -name "${package}_*.ipk" \
              -print -quit | grep -q .; then

              echo "ERROR: Missing package $package"
              exit 1

            fi

          done

          cp "$GITHUB_WORKSPACE/sft1200.config" "$DEST/"

          cd "$DEST"

          sha256sum *.ipk > SHA256SUMS

          printf '%s\n' \
            "GL-SFT1200 Opal" \
            "Siflower SF19A2890" \
            "OpenWrt 18.06" \
            "mipsel_24kc" \
            > BUILD_INFO.txt

          ls -lh

          BUILDER

      - name: Upload IPK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SFT1200-4G-5G-Drivers
          path: ${{ runner.temp }}/ipk-artifacts/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Final Disk Report
        if: always()
        shell: bash
        run: |
          df -h
          echo "Build completed"
