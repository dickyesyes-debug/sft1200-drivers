
name: SFT1200 Non Root Driver Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      TZ: Asia/Taipei
      SDK_ROOT: /home/builder/gl_sdk/sdk/1806/siflower
      BUILD_JOBS: 2

    steps:

      - name: Clean Disk Space
        shell: bash
        run: |
          set -eux

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium

          df -h

      - name: Install Build Dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            binutils \
            ccache \
            ecj \
            fastjar \
            file \
            gawk \
            gettext \
            git \
            subversion \
            libncurses5-dev \
            libz-dev \
            patch \
            python3 \
            python3-pip \
            python3-setuptools \
            unzip \
            zlib1g-dev \
            libssl-dev \
            libglib2.0-dev \
            xsltproc \
            libxml2-utils \
            bc \
            tmux \
            quilt \
            time \
            rsync \
            wget \
            curl \
            perl \
            flex \
            bison \
            gperf \
            make \
            tar \
            xz-utils \
            jq \
            cpio \
            libelf-dev \
            device-tree-compiler

          sudo ln -sf /usr/share/zoneinfo/Asia/Taipei /etc/localtime

          python3 --version
          git --version
          df -h

      - name: Create Builder User
        shell: bash
        run: |
          set -eux

          if ! id builder >/dev/null 2>&1; then
            sudo useradd -m -s /bin/bash builder
          fi

          sudo mkdir -p /home/builder

          sudo chown -R builder:builder /home/builder
          sudo chmod 755 /home/builder

          if [ "$(id -u builder)" -eq 0 ]; then
            echo "ERROR: Builder cannot be root"
            exit 1
          fi

          id builder

      - name: Verify Builder Permissions
        shell: bash
        run: |
          set -eux

          sudo -u builder bash -c '
            cd /home/builder
            mkdir -p permission-test
            touch permission-test/test.txt
            test -f permission-test/test.txt
            rm -rf permission-test
            id
          '

          echo "Builder permission test passed"

      - name: Clone GL.iNet SDK
        shell: bash
        run: |
          set -eux

          sudo -u builder env \
            HOME=/home/builder \
            bash -euo pipefail <<'BUILDER'

          cd /home/builder

          git clone \
            --depth 1 \
            https://github.com/gl-inet/sdk.git \
            gl_sdk

          cd /home/builder/gl_sdk

          test -f download.sh

          ./download.sh siflower-1806

          test -d sdk/1806/siflower

          cd sdk/1806/siflower

          test -f Makefile
          test -d package

          echo "GL.iNet SDK download completed"

          BUILDER

      - name: Update Feeds
        shell: bash
        run: |
          set -eux

          sudo -u builder env \
            HOME=/home/builder \
            SDK_ROOT="$SDK_ROOT" \
            bash -euo pipefail <<'BUILDER'

          cd "$SDK_ROOT"

          ./scripts/feeds update -a

          ./scripts/feeds install -a

          echo "Feeds update completed"

          BUILDER

      - name: Locate XMM Protocol
        shell: bash
        run: |
          set -eux

          sudo -u builder env \
            HOME=/home/builder \
            SDK_ROOT="$SDK_ROOT" \
            bash -euo pipefail <<'BUILDER'

          cd "$SDK_ROOT"

          XMM_FILE=$(find package feeds \
            -type f \
            -path '*/luci-proto-xmm/Makefile' \
            -print -quit 2>/dev/null || true)

          if [ -z "$XMM_FILE" ]; then
            echo "ERROR: luci-proto-xmm source not found"
            echo "Please add the official XMM package source."
            exit 1
          fi

          echo "XMM package found:"
          echo "$XMM_FILE"

          BUILDER

      - name: Generate SFT1200 Configuration
        shell: bash
        run: |
          set -eux

          sudo -u builder env \
            HOME=/home/builder \
            bash -euo pipefail <<'BUILDER'

          cd /home/builder/gl_sdk

          if [ -f scripts/gen_config.py ]; then
            python3 scripts/gen_config.py target_siflower_gl-sft1200
          else
            echo "No gen_config.py found in SDK"
            echo "Checking existing Siflower configuration"
          fi

          BUILDER

      - name: Configure Modular Packages
        shell: bash
        run: |
          set -eux

          sudo -u builder env \
            HOME=/home/builder \
            SDK_ROOT="$SDK_ROOT" \
            bash -euo pipefail <<'BUILDER'

          cd "$SDK_ROOT"

          make defconfig

          PACKAGES="
          luci-proto-xmm
          usb-modeswitch
          kmod-usb-net-cdc-mbim
          kmod-usb-net-cdc-ncm
          kmod-usb-serial-option
          kmod-usb-serial
          kmod-usb-serial-wwan
          kmod-usb-net
          kmod-usb-wdm
          "

          for package in $PACKAGES; do
            sed -i "/^CONFIG_PACKAGE_${package}=/d" .config
            echo "CONFIG_PACKAGE_${package}=m" >> .config
          done

          make defconfig

          for package in $PACKAGES; do
            if ! grep -Fxq "CONFIG_PACKAGE_${package}=m" .config; then
              echo "ERROR: Package not enabled: $package"
              exit 1
            fi
          done

          cp .config /home/builder/sft1200.config

          echo "Modular package configuration completed"

          BUILDER

      - name: Build XMM Protocol
        shell: bash
        run: |
          set -eux

          sudo -u builder env \
            HOME=/home/builder \
            SDK_ROOT="$SDK_ROOT" \
            bash -euo pipefail <<'BUILDER'

          cd "$SDK_ROOT"

          XMM_FILE=$(find package feeds \
            -type f \
            -path '*/luci-proto-xmm/Makefile' \
            -print -quit)

          XMM_DIR=$(dirname "$XMM_FILE")

          RELATIVE_DIR="${XMM_DIR#./}"

          make -j2 "$RELATIVE_DIR/compile" V=s

          BUILDER

      - name: Build USB Mode Switch
        shell: bash
        run: |
          set -eux

          sudo -u builder env \
            HOME=/home/builder \
            SDK_ROOT="$SDK_ROOT" \
            bash -euo pipefail <<'BUILDER'

          cd "$SDK_ROOT"

          make -j2 package/usb-modeswitch/compile V=s

          BUILDER

      - name: Build USB Kernel Modules
        shell: bash
        run: |
          set -eux

          sudo -u builder env \
            HOME=/home/builder \
            SDK_ROOT="$SDK_ROOT" \
            bash -euo pipefail <<'BUILDER'

          cd "$SDK_ROOT"

          make -j2 package/kernel/linux/compile V=s

          BUILDER

      - name: Collect IPK Packages
        shell: bash
        run: |
          set -eux

          sudo mkdir -p "$RUNNER_TEMP/ipk-artifacts"

          sudo chown builder:builder "$RUNNER_TEMP/ipk-artifacts"

          sudo -u builder env \
            HOME=/home/builder \
            SDK_ROOT="$SDK_ROOT" \
            DEST="$RUNNER_TEMP/ipk-artifacts" \
            bash -euo pipefail <<'BUILDER'

          cd "$SDK_ROOT"

          PACKAGES="
          luci-proto-xmm
          usb-modeswitch
          kmod-usb-net-cdc-mbim
          kmod-usb-net-cdc-ncm
          kmod-usb-serial-option
          kmod-usb-serial
          kmod-usb-serial-wwan
          kmod-usb-net
          kmod-usb-wdm
          "

          for package in $PACKAGES; do

            find bin -type f \
              -name "${package}_*.ipk" \
              -exec cp -f {} "$DEST/" \; \
              2>/dev/null || true

          done

          for package in $PACKAGES; do

            if ! find "$DEST" \
              -maxdepth 1 \
              -name "${package}_*.ipk" \
              -print -quit | grep -q .; then

              echo "ERROR: Missing IPK: $package"
              exit 1
            fi

          done

          cp /home/builder/sft1200.config "$DEST/"

          cd "$DEST"

          sha256sum *.ipk > SHA256SUMS

          printf '%s\n' \
            "GL-SFT1200 Opal" \
            "Siflower SF19A2890" \
            "OpenWrt 18.06" \
            "mipsel_24kc" \
            > BUILD_INFO.txt

          ls -lh

          BUILDER

          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/ipk-artifacts"

      - name: Upload IPK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SFT1200-4G-5G-Drivers
          path: ${{ runner.temp }}/ipk-artifacts/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Final Build Report
        if: always()
        shell: bash
        run: |
          echo "Build report"
          df -h
          echo "Builder identity:"
          id builder
