name: Build SFT1200 Drivers Final

on:
  workflow_dispatch:

jobs:
  build:
    # 第一重防護：降級回 ubuntu-20.04，使用較舊、較寬容的 GCC 9
    runs-on: ubuntu-20.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Tools
      run: |
        sudo apt update
        sudo apt install -y build-essential ccache ecj fastjar file g++ gawk gettext git subversion libncurses5-dev libz-dev patch python3 python3-pip unzip zlib1g-dev libssl-dev libglib2.0-dev xsltproc libxml2-utils bc tmux quilt time rsync

    - name: Clone SDK & Download Base
      run: |
        git clone https://github.com/gl-inet/sdk.git gl_sdk
        cd gl_sdk
        ./download.sh siflower-1806

    - name: Update Feeds
      run: |
        cd gl_sdk/sdk/1806/siflower
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Remove All Broken & Unneeded Minefields
      run: |
        cd gl_sdk/sdk/1806/siflower
        # 移除會導致 404 或編譯錯誤的無關套件
        rm -rf feeds/base/firmware/linux-firmware package/feeds/base/linux-firmware
        rm -rf feeds/base/firmware/ath10k-firmware package/feeds/base/ath10k-firmware
        rm -rf feeds/base/firmware/wireless-regdb package/feeds/base/wireless-regdb
        rm -rf feeds/base/kernel/mac80211 package/feeds/base/mac80211
        rm -rf feeds/base/net/hostapd package/feeds/base/hostapd
        rm -rf feeds/base/kernel/cryptodev-linux package/feeds/base/cryptodev-linux
        rm -rf feeds/gli_pub/openssl package/feeds/gli_pub/openssl
        rm -rf feeds/gli_pub/iproute2 package/feeds/gli_pub/iproute2
        rm -rf feeds/base/openwrt-18.06/package/utils/adb package/feeds/base/adb

    - name: Global Bypass Werror
      run: |
        cd gl_sdk/sdk/1806/siflower
        # 第二重防護：在編譯前，暴力搜尋並刪除所有設定檔中的 -Werror (將警告視為錯誤) 參數
        find . -type f -name "CMakeLists.txt" -exec sed -i 's/-Werror//g' {} +
        find . -type f -name "Makefile" -exec sed -i 's/-Werror//g' {} +

    - name: Configure Drivers
      run: |
        cd gl_sdk/sdk/1806/siflower
        
        # 寫入 USB 網卡與 4G/5G 驅動模組配置
        cat <<EOF >> .config
        CONFIG_PACKAGE_luci-proto-xmm=m
        CONFIG_PACKAGE_usb-modeswitch=m
        CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=m
        CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=m
        CONFIG_PACKAGE_kmod-usb-serial-option=m
        CONFIG_PACKAGE_kmod-usb-serial=m
        CONFIG_PACKAGE_kmod-usb-serial-wwan=m
        CONFIG_PACKAGE_kmod-usb-net=m
        CONFIG_PACKAGE_kmod-usb-wdm=m
        EOF
        
        make defconfig

    - name: Compile
      run: |
        cd gl_sdk/sdk/1806/siflower
        
        # 第三重防護：直接向編譯器下達指令，強制忽略陣列越界 (-Wno-array-bounds) 等警告
        export HOST_CFLAGS="-O2 -Wno-error -Wno-array-bounds -Wno-stringop-overflow"
        export TARGET_CFLAGS="-O2 -Wno-error -Wno-array-bounds -Wno-stringop-overflow"
        
        make -j$(nproc) || make -j1 V=s

    - name: Upload IPKs
      uses: actions/upload-artifact@v4
      with:
        name: sft1200-18.06-drivers
        path: |
          gl_sdk/sdk/1806/siflower/bin/packages/*/*/luci-proto-xmm_*.ipk
          gl_sdk/sdk/1806/siflower/bin/packages/*/*/base/usb-modeswitch_*.ipk
          gl_sdk/sdk/1806/siflower/bin/targets/siflower/*/packages/kmod-usb-*.ipk
