name: Build SFT1200 Drivers Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Tools
      run: sudo apt update && sudo apt install -y build-essential ccache ecj fastjar file g++ gawk gettext git subversion libncurses5-dev libz-dev patch python3 python3-pip unzip zlib1g-dev libssl-dev libglib2.0-dev xsltproc libxml2-utils bc tmux quilt time rsync

    - name: Download SDK
      run: git clone https://github.com sdk && cd sdk && (git checkout refs/tags/v4.3.25 || git checkout -b v4.3.25 origin/v4.3.25 || true) && ./scripts/feeds update -a && ./scripts/feeds install -a

    - name: Add LuCI Source
      run: cd sdk && mkdir -p package/custom && cd package/custom && git clone --depth 1 https://github.com && mv luci/protocols/luci-proto-xmm ./ && rm -rf luci

    - name: Configure Drivers
      run: |
        cd sdk
        make defconfig
        cat <<EOF >> .config
        CONFIG_PACKAGE_luci-proto-xmm=m
        CONFIG_PACKAGE_usb-modeswitch=m
        CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=m
        CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=m
        CONFIG_PACKAGE_kmod-usb-serial-option=m
        CONFIG_PACKAGE_kmod-usb-serial=m
        CONFIG_PACKAGE_kmod-usb-serial-wwan=m
        CONFIG_PACKAGE_kmod-usb-net=m
        CONFIG_PACKAGE_kmod-usb-wdm=m
        EOF
        mkdir -p tmp
        make oldconfig < /dev/null

    - name: Compile
      run: |
        cd sdk
        make tools/install -j$(nproc) || true
        make toolchain/install -j$(nproc) || true
        make package/custom/luci-proto-xmm/compile V=s
        make package/utils/usb-modeswitch/compile V=s
        make package/kernel/linux/compile V=s

    - name: Upload IPKs
      uses: actions/upload-artifact@v4
      with:
        name: sft1200-4.3.25-drivers
        path: |
          sdk/bin/packages/mipsel_24kc/custom/luci-proto-xmm_*.ipk
          sdk/bin/packages/mipsel_24kc/base/usb-modeswitch_*.ipk
          sdk/bin/targets/siflower/gl-sft1200/packages/kmod-usb-*.ipk
