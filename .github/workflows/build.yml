
name: GL-SFT1200 Opal 4G-5G Modular Packages

on:
  workflow_dispatch:
    inputs:
      protocols_repo:
        description: Git repository containing protocols/luci-proto-xmm
        required: true
        type: string
      protocols_branch:
        description: Protocol repository branch
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      DEBIAN_FRONTEND: noninteractive
      BUILD_ROOT: gl-infra-builder
      OPENWRT_DIR: gl-infra-builder/openwrt-18.06/siflower/openwrt-18.06
      MAKE_JOBS: 2

    steps:

      - name: Free Disk Space
        shell: bash
        run: |
          set -eux

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/local/share/chromium
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /usr/share/swift
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost

          sudo apt-get clean
          sudo apt-get autoremove -y
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /var/cache/apt/archives/*
          sudo rm -rf /tmp/*
          sudo rm -rf /var/tmp/*

          docker system prune -af || true

          df -h

      - name: Install Build Dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc-9 \
            g++-9 \
            gcc-multilib \
            g++-multilib \
            binutils \
            bzip2 \
            flex \
            gawk \
            gettext \
            git \
            git-core \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            zlib1g-dev \
            libelf-dev \
            libtool \
            autoconf \
            automake \
            pkg-config \
            python3 \
            python3-distutils \
            python3-setuptools \
            rsync \
            subversion \
            unzip \
            wget \
            curl \
            file \
            time \
            xsltproc \
            swig \
            ccache \
            patch \
            perl \
            tar \
            xz-utils \
            jq

          sudo update-alternatives \
            --install /usr/bin/gcc gcc /usr/bin/gcc-9 100

          sudo update-alternatives \
            --install /usr/bin/g++ g++ /usr/bin/g++-9 100

          gcc --version
          python3 --version

          df -h

      - name: Clone GL.iNet Infrastructure
        shell: bash
        run: |
          set -eux

          git clone \
            --depth 1 \
            https://github.com/gl-inet/gl-infra-builder.git \
            "$BUILD_ROOT"

      - name: Initialize Siflower 18.06
        shell: bash
        run: |
          set -eux

          cd "$BUILD_ROOT"

          python3 setup.py -c config-siflower-18.x.yml

          test -d ../gl-infra-builder/openwrt-18.06/siflower/openwrt-18.06

      - name: Import luci-proto-xmm
        shell: bash
        env:
          PROTOCOLS_REPO: ${{ inputs.protocols_repo }}
          PROTOCOLS_BRANCH: ${{ inputs.protocols_branch }}
        run: |
          set -eux

          git clone \
            --depth 1 \
            --branch "$PROTOCOLS_BRANCH" \
            "$PROTOCOLS_REPO" \
            /tmp/protocol-source

          test -d /tmp/protocol-source/protocols/luci-proto-xmm

          mkdir -p "$OPENWRT_DIR/package/custom"

          rm -rf "$OPENWRT_DIR/package/custom/luci-proto-xmm"

          cp -a \
            /tmp/protocol-source/protocols/luci-proto-xmm \
            "$OPENWRT_DIR/package/custom/luci-proto-xmm"

      - name: Generate SFT1200 Configuration
        shell: bash
        run: |
          set -eux

          cd "$OPENWRT_DIR"

          python3 ../../../scripts/gen_config.py \
            target_siflower_gl-sft1200

      - name: Update and Install Feeds
        shell: bash
        run: |
          set -eux

          cd "$OPENWRT_DIR"

          ./scripts/feeds update -a

          ./scripts/feeds install -a

      - name: Configure Modular Packages
        shell: bash
        run: |
          set -eux

          cd "$OPENWRT_DIR"

          CONFIG_FILE=".config"

          touch "$CONFIG_FILE"

          PACKAGES=(
            luci-proto-xmm
            usb-modeswitch
            kmod-usb-net-cdc-mbim
            kmod-usb-net-cdc-ncm
            kmod-usb-serial-option
            kmod-usb-serial
            kmod-usb-serial-wwan
            kmod-usb-net
            kmod-usb-wdm
          )

          for package in "${PACKAGES[@]}"; do
            sed -i "/^CONFIG_PACKAGE_${package}=/d" "$CONFIG_FILE"
            echo "CONFIG_PACKAGE_${package}=m" >> "$CONFIG_FILE"
          done

          make defconfig

          for package in "${PACKAGES[@]}"; do
            grep -Fx "CONFIG_PACKAGE_${package}=m" "$CONFIG_FILE" || {
              echo "Package configuration missing: $package"
              exit 1
            }
          done

          cp .config /tmp/sft1200-modular.config

          df -h

      - name: Compile Modular Packages
        shell: bash
        run: |
          set -eux

          cd "$OPENWRT_DIR"

          make -j"$MAKE_JOBS" V=s package/compile

      - name: Collect MIPSel 24kc IPK Packages
        shell: bash
        run: |
          set -eux

          cd "$OPENWRT_DIR"

          mkdir -p "$RUNNER_TEMP/ipk-artifacts"

          find bin/packages bin/targets \
            -type f \
            -name '*.ipk' \
            -print0 |
          while IFS= read -r -d '' package; do

            filename="$(basename "$package")"

            case "$filename" in
              luci-proto-xmm_*)
                cp "$package" "$RUNNER_TEMP/ipk-artifacts/"
                ;;
              usb-modeswitch_*)
                cp "$package" "$RUNNER_TEMP/ipk-artifacts/"
                ;;
              kmod-usb-*)
                cp "$package" "$RUNNER_TEMP/ipk-artifacts/"
                ;;
            esac

          done

          echo "Collected packages:"
          ls -lh "$RUNNER_TEMP/ipk-artifacts"

          test -n "$(find "$RUNNER_TEMP/ipk-artifacts" -name 'luci-proto-xmm_*.ipk' -print -quit)"

          test -n "$(find "$RUNNER_TEMP/ipk-artifacts" -name 'usb-modeswitch_*.ipk' -print -quit)"

          for package in \
            kmod-usb-net-cdc-mbim \
            kmod-usb-net-cdc-ncm \
            kmod-usb-serial-option \
            kmod-usb-serial \
            kmod-usb-serial-wwan \
            kmod-usb-net \
            kmod-usb-wdm
          do
            test -n "$(find "$RUNNER_TEMP/ipk-artifacts" -name "${package}_*.ipk" -print -quit)"
          done

          find "$RUNNER_TEMP/ipk-artifacts" -name '*.ipk' \
            -exec file {} \;

      - name: Upload IPK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GL-SFT1200-Opal-mipsel-24kc-4G-5G-Packages
          path: ${{ runner.temp }}/ipk-artifacts/*.ipk
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Build Summary
        if: always()
        shell: bash
        run: |
          echo "GL-SFT1200 modular package build finished."
          df -h
