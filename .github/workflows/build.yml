name: Build SFT1200 Drivers Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ubuntu:20.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Prepare Container Environment & Create Builder User
      run: |
        export DEBIAN_FRONTEND=noninteractive
        apt-get update
        apt-get install -y sudo tzdata python2 python-is-python2 build-essential ccache ecj fastjar file g++ gawk gettext git subversion libncurses5-dev libz-dev patch python3 python3-pip unzip zlib1g-dev libssl-dev libglib2.0-dev xsltproc libxml2-utils bc tmux quilt time rsync wget curl perl
        
        ln -fs /usr/share/zoneinfo/Asia/Taipei /etc/localtime
        dpkg-reconfigure --frontend noninteractive tzdata

        useradd -m -s /bin/bash builder
        echo "builder ALL=(ALL) NOPASSWD:ALL" >> /etc/sudoers
        
        chown -R builder:builder /github/home || true
        chown -R builder:builder $GITHUB_WORKSPACE

    - name: Build Drivers as Non-Root User
      run: |
        sudo -E -u builder bash -c '
          export HOME=/home/builder
          set -e
          cd "$GITHUB_WORKSPACE"
          
          # 1. Clone SDK
          git config --global --add safe.directory "*"
          git clone https://github.com/gl-inet/sdk.git gl_sdk
          cd gl_sdk
          ./download.sh siflower-1806
          
          # 2. Update & Install Feeds
          cd sdk/1806/siflower
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          
          # 3. 完整焦土政策：刪除所有會導致編譯失敗/404/依賴缺失的套件
          rm -rf package/feeds/gli_pub/iproute2 feeds/gli_pub/iproute2
          rm -rf package/feeds/base/linux-firmware feeds/base/firmware/linux-firmware
          rm -rf package/feeds/base/batman-adv feeds/base/net/batman-adv
          rm -rf package/feeds/gli_pub/openssl feeds/gli_pub/openssl package/libs/openssl feeds/base/package/libs/openssl
          
          # 補回漏掉的刪除項目，包含這次報錯的 adb
          rm -rf feeds/base/openwrt-18.06/package/utils/adb package/feeds/base/adb
          rm -rf feeds/base/firmware/* package/feeds/base/*firmware*
          rm -rf feeds/base/package/utils/b43-tools package/feeds/base/b43-tools
          rm -rf feeds/base/kernel/mac80211 package/feeds/base/mac80211
          rm -rf feeds/base/net/hostapd package/feeds/base/hostapd
          rm -rf feeds/base/net/wpa_supplicant package/feeds/base/wpa_supplicant
          rm -rf feeds/base/kernel/sound package/feeds/base/sound
          rm -rf feeds/base/kernel/video package/feeds/base/video
          rm -rf feeds/base/kernel/drm package/feeds/base/drm
          rm -rf feeds/base/kernel/cryptodev-linux package/feeds/base/cryptodev-linux
          rm -rf package/kernel/button-hotplug
          
          # 4. 拔除獨立 -Werror 參數
          find . -type f -name "CMakeLists.txt" -exec perl -pi -e "s/(^|\s)-Werror($|\s)/ /g" {} +
          find . -type f -name "Makefile" -exec perl -pi -e "s/(^|\s)-Werror($|\s)/ /g" {} +
          
          # 5. 配置驅動
          make defconfig
          sed -i "s/CONFIG_SIGNED_PACKAGES=y/# CONFIG_SIGNED_PACKAGES is not set/" .config
          
          echo "CONFIG_PACKAGE_luci-proto-xmm=m" >> .config
          echo "CONFIG_PACKAGE_usb-modeswitch=m" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=m" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=m" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-serial-option=m" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-serial=m" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-serial-wwan=m" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-net=m" >> .config
          echo "CONFIG_PACKAGE_kmod-usb-wdm=m" >> .config
          
          make defconfig
          
          # 6. 編譯
          export HOST_CFLAGS="-O2 -Wno-error -Wno-array-bounds -Wno-stringop-overflow"
          export TARGET_CFLAGS="-O2 -Wno-error -Wno-array-bounds -Wno-stringop-overflow"
          
          make -j$(nproc) || make -j1 V=s
        '

    - name: Upload IPKs
      uses: actions/upload-artifact@v4
      with:
        name: sft1200-18.06-drivers
        path: |
          gl_sdk/sdk/1806/siflower/bin/**/luci-proto-xmm_*.ipk
          gl_sdk/sdk/1806/siflower/bin/**/usb-modeswitch_*.ipk
          gl_sdk/sdk/1806/siflower/bin/**/kmod-usb-*.ipk
