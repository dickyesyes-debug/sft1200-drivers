name: Build SFT1200 4.3.25 Drivers

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Tools
      run: |
        sudo apt update
        sudo apt install -y build-essential ccache ecj fastjar file g++ gawk gettext git java-progs subversion libncurses5-dev libz-dev patch python3 python3-pip unzip zlib1g-dev libssl-dev glib2.0-dev xsltproc libxml2-utils-dev bc tmux quilt time rsync

    - name: Download GL.iNet Siflower SDK
      run: |
        # 複製官方 Siflower SDK 倉庫
        git clone https://github.com sdk
        cd sdk
        # 更新並安裝套件源
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Add LuCI Protocols Source
      run: |
        cd sdk
        mkdir -p package/custom
        cd package/custom
        # 拉取與 4.3.x 固件（OpenWrt 18.06 基底）相容的 LuCI 協定原始碼
        git clone --depth 1 -b openwrt-18.06 https://github.com
        mv luci/protocols/luci-proto-xmm ./
        rm -rf luci

    - name: Configure Drivers and Packages
      run: |
        cd sdk
        # 1. 載入 SFT1200 的預設硬體配置
        make defconfig
        
        # 2. 注入你指定的所有 4G/5G 核心驅動與軟體包
        cat <<EOF >> .config
        CONFIG_PACKAGE_luci-proto-xmm=m
        CONFIG_PACKAGE_usb-modeswitch=m
        CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=m
        CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=m
        CONFIG_PACKAGE_kmod-usb-serial-option=m
        CONFIG_PACKAGE_kmod-usb-serial=m
        CONFIG_PACKAGE_kmod-usb-serial-wwan=m
        CONFIG_PACKAGE_kmod-usb-net=m
        CONFIG_PACKAGE_kmod-usb-wdm=m
        EOF
        
        # 3. 讓系統自動修復並補齊依賴關係（不可使用 defconfig，否則核心模組會被剔除）
        make oldconfig

    - name: Compile Toolchain and Packages
      run: |
        cd sdk
        # 準備編譯環境（防止找不到工具鏈報錯）
        make tools/install -j$(nproc) || true
        make toolchain/install -j$(nproc) || true
        
        # 開始分步編譯指定驅動與套件
        make package/custom/luci-proto-xmm/compile V=s
        make package/utils/usb-modeswitch/compile V=s
        make package/kernel/linux/compile V=s

    - name: Collect and Upload IPKs
      uses: actions/upload-artifact@v4
      with:
        name: sft1200-4.3.25-drivers
        path: |
          sdk/bin/packages/mipsel_24kc/custom/luci-proto-xmm_*.ipk
          sdk/bin/packages/mipsel_24kc/base/usb-modeswitch_*.ipk
          sdk/bin/targets/siflower/gl-sft1200/packages/kmod-usb-*.ipk
