
name: Build SFT1200 Drivers Final

on:
  workflow_dispatch:
    inputs:
      xmm_repo:
        description: GitHub repository containing protocols/luci-proto-xmm
        required: true
        type: string
      xmm_branch:
        description: XMM repository branch
        required: false
        default: main
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ubuntu:20.04

    timeout-minutes: 360

    env:
      TZ: Asia/Taipei
      SDK_DIR: gl_sdk/sdk/1806/siflower
      BUILD_JOBS: 2

    steps:

      - name: Prepare Container Environment
        shell: bash
        run: |
          set -eux

          export DEBIAN_FRONTEND=noninteractive

          apt-get update

          apt-get install -y \
            tzdata \
            sudo \
            git \
            ca-certificates \
            python2 \
            python-is-python2 \
            python3 \
            python3-pip \
            build-essential \
            gcc \
            g++ \
            binutils \
            ccache \
            ecj \
            fastjar \
            file \
            gawk \
            gettext \
            subversion \
            libncurses5-dev \
            libz-dev \
            patch \
            unzip \
            zlib1g-dev \
            libssl-dev \
            libglib2.0-dev \
            xsltproc \
            libxml2-utils \
            bc \
            tmux \
            quilt \
            time \
            rsync \
            wget \
            curl \
            perl \
            flex \
            bison \
            gperf \
            make \
            tar \
            xz-utils \
            jq \
            findutils \
            ca-certificates

          ln -fs /usr/share/zoneinfo/Asia/Taipei /etc/localtime

          dpkg-reconfigure --frontend noninteractive tzdata

          python --version
          python2 --version
          python3 --version

      - name: Create Build User
        shell: bash
        run: |
          set -eux

          useradd -m -s /bin/bash builder

          mkdir -p "$GITHUB_WORKSPACE"

          chown -R builder:builder "$GITHUB_WORKSPACE"

          df -h

      - name: Clone SDK and Download Base
        shell: bash
        run: |
          set -eux

          runuser -u builder -- bash -s <<'BUILDER'
          set -eux

          cd "$GITHUB_WORKSPACE"

          git clone \
            --depth 1 \
            https://github.com/gl-inet/sdk.git \
            gl_sdk

          cd gl_sdk

          ./download.sh siflower-1806

          cd sdk/1806/siflower

          git config --global --add safe.directory '*'

          test -f Makefile
          test -d package
          test -d target

          BUILDER

      - name: Import XMM Protocol Package
        shell: bash
        env:
          XMM_REPO: ${{ inputs.xmm_repo }}
          XMM_BRANCH: ${{ inputs.xmm_branch }}
        run: |
          set -eux

          if [ -z "$XMM_REPO" ]; then
            echo "XMM repository is required"
            exit 1
          fi

          runuser -u builder -- env \
            XMM_REPO="$XMM_REPO" \
            XMM_BRANCH="$XMM_BRANCH" \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            bash -s <<'BUILDER'

          set -eux

          cd "$GITHUB_WORKSPACE"

          git clone \
            --depth 1 \
            --branch "$XMM_BRANCH" \
            "$XMM_REPO" \
            /home/builder/xmm-source

          if [ -f /home/builder/xmm-source/protocols/luci-proto-xmm/Makefile ]; then
            XMM_PACKAGE=/home/builder/xmm-source/protocols/luci-proto-xmm
          elif [ -f /home/builder/xmm-source/luci-proto-xmm/Makefile ]; then
            XMM_PACKAGE=/home/builder/xmm-source/luci-proto-xmm
          elif [ -f /home/builder/xmm-source/Makefile ]; then
            XMM_PACKAGE=/home/builder/xmm-source
          else
            echo "Cannot find luci-proto-xmm Makefile"
            exit 1
          fi

          mkdir -p gl_sdk/sdk/1806/siflower/package/custom

          rm -rf gl_sdk/sdk/1806/siflower/package/custom/luci-proto-xmm

          cp -a "$XMM_PACKAGE" \
            gl_sdk/sdk/1806/siflower/package/custom/luci-proto-xmm

          test -f gl_sdk/sdk/1806/siflower/package/custom/luci-proto-xmm/Makefile

          BUILDER

      - name: Update and Install Feeds
        shell: bash
        run: |
          set -eux

          runuser -u builder -- bash -s <<'BUILDER'

          set -eux

          cd "$GITHUB_WORKSPACE/$SDK_DIR"

          ./scripts/feeds update -a

          ./scripts/feeds install -a

          BUILDER

      - name: Verify Package Sources
        shell: bash
        run: |
          set -eux

          runuser -u builder -- bash -s <<'BUILDER'

          set -eux

          cd "$GITHUB_WORKSPACE/$SDK_DIR"

          test -f package/custom/luci-proto-xmm/Makefile

          find package -name Makefile -type f \
            | grep -E 'usb-modeswitch|luci-proto-xmm' || true

          BUILDER

      - name: Configure Modular Drivers
        shell: bash
        run: |
          set -eux

          runuser -u builder -- bash -s <<'BUILDER'

          set -eux

          cd "$GITHUB_WORKSPACE/$SDK_DIR"

          PACKAGES=(
            luci-proto-xmm
            usb-modeswitch
            kmod-usb-net-cdc-mbim
            kmod-usb-net-cdc-ncm
            kmod-usb-serial-option
            kmod-usb-serial
            kmod-usb-serial-wwan
            kmod-usb-net
            kmod-usb-wdm
          )

          test -f .config

          for package in "${PACKAGES[@]}"; do
            sed -i "/^CONFIG_PACKAGE_${package}=/d" .config
            echo "CONFIG_PACKAGE_${package}=m" >> .config
          done

          make defconfig

          for package in "${PACKAGES[@]}"; do
            if ! grep -Fxq "CONFIG_PACKAGE_${package}=m" .config; then
              echo "Package unavailable: $package"
              exit 1
            fi
          done

          cp .config "$GITHUB_WORKSPACE/sft1200.config"

          BUILDER

      - name: Build XMM Protocol
        shell: bash
        run: |
          set -eux

          runuser -u builder -- bash -s <<'BUILDER'

          set -eux

          cd "$GITHUB_WORKSPACE/$SDK_DIR"

          make -j2 package/luci-proto-xmm/compile V=s

          BUILDER

      - name: Build USB Mode Switch
        shell: bash
        run: |
          set -eux

          runuser -u builder -- bash -s <<'BUILDER'

          set -eux

          cd "$GITHUB_WORKSPACE/$SDK_DIR"

          make -j2 package/usb-modeswitch/compile V=s

          BUILDER

      - name: Build USB Kernel Modules
        shell: bash
        run: |
          set -eux

          runuser -u builder -- bash -s <<'BUILDER'

          set -eux

          cd "$GITHUB_WORKSPACE/$SDK_DIR"

          make -j2 package/kernel/linux/compile V=s

          BUILDER

      - name: Collect IPK Packages
        shell: bash
        run: |
          set -eux

          mkdir -p "$RUNNER_TEMP/ipk-artifacts"

          chown -R builder:builder "$RUNNER_TEMP/ipk-artifacts"

          runuser -u builder -- env \
            GITHUB_WORKSPACE="$GITHUB_WORKSPACE" \
            RUNNER_TEMP="$RUNNER_TEMP" \
            SDK_DIR="$SDK_DIR" \
            bash -s <<'BUILDER'

          set -eux

          cd "$GITHUB_WORKSPACE/$SDK_DIR"

          ARTIFACT_DIR="$RUNNER_TEMP/ipk-artifacts"

          PACKAGES=(
            luci-proto-xmm
            usb-modeswitch
            kmod-usb-net-cdc-mbim
            kmod-usb-net-cdc-ncm
            kmod-usb-serial-option
            kmod-usb-serial
            kmod-usb-serial-wwan
            kmod-usb-net
            kmod-usb-wdm
          )

          for package in "${PACKAGES[@]}"; do

            find bin -type f \
              -name "${package}_*.ipk" \
              -exec cp -f {} "$ARTIFACT_DIR/" \; \
              2>/dev/null || true

          done

          for package in "${PACKAGES[@]}"; do

            if ! find "$ARTIFACT_DIR" \
              -maxdepth 1 \
              -name "${package}_*.ipk" \
              -print -quit | grep -q .; then

              echo "Missing package: $package"
              exit 1

            fi

          done

          cp "$GITHUB_WORKSPACE/sft1200.config" \
            "$ARTIFACT_DIR/"

          printf '%s\n' \
            "GL-SFT1200" \
            "Siflower 18.06" \
            "Target architecture: mipsel_24kc" \
            > "$ARTIFACT_DIR/BUILD_INFO.txt"

          cd "$ARTIFACT_DIR"

          sha256sum *.ipk > SHA256SUMS

          ls -lh

          BUILDER

      - name: Upload IPK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SFT1200-4G-5G-mipsel-24kc
          path: ${{ runner.temp }}/ipk-artifacts/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

      - name: Build Summary
        if: always()
        shell: bash
        run: |
          df -h
          echo "SFT1200 package build finished"
