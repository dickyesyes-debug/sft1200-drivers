name: Build SFT1200 Drivers Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container: ubuntu:20.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Prepare Container Environment
      run: |
        apt-get update
        apt-get install -y sudo tzdata
        ln -fs /usr/share/zoneinfo/Asia/Taipei /etc/localtime
        dpkg-reconfigure --frontend noninteractive tzdata
        
        # 必須安裝 Python 2 確保舊環境相容
        apt-get install -y python2 python-is-python2

    - name: Install Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache ecj fastjar file g++ gawk gettext git subversion libncurses5-dev libz-dev patch python3 python3-pip unzip zlib1g-dev libssl-dev libglib2.0-dev xsltproc libxml2-utils bc tmux quilt time rsync wget curl perl

    - name: Clone SDK & Download Base
      run: |
        git config --global --add safe.directory '*'
        git clone https://github.com/gl-inet/sdk.git gl_sdk
        cd gl_sdk
        ./download.sh siflower-1806

    - name: Update Feeds
      run: |
        cd gl_sdk/sdk/1806/siflower
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Ultimate Scorched Earth (Physical Deletion)
      run: |
        cd gl_sdk/sdk/1806/siflower
        
        rm -rf feeds/base/firmware package/feeds/base/linux-firmware package/feeds/base/*firmware*
        rm -rf feeds/base/package/utils/b43-tools package/feeds/base/b43-tools
        rm -rf feeds/base/kernel/mac80211 package/feeds/base/mac80211
        rm -rf feeds/base/net/hostapd package/feeds/base/hostapd
        rm -rf feeds/base/net/wpa_supplicant package/feeds/base/wpa_supplicant
        
        rm -rf feeds/base/kernel/sound package/feeds/base/sound
        rm -rf feeds/base/kernel/video package/feeds/base/video
        rm -rf feeds/base/kernel/drm package/feeds/base/drm
        
        rm -rf feeds/base/kernel/cryptodev-linux package/feeds/base/cryptodev-linux
        rm -rf feeds/gli_pub/openssl package/feeds/gli_pub/openssl package/libs/openssl feeds/base/package/libs/openssl
        rm -rf feeds/gli_pub/iproute2 package/feeds/gli_pub/iproute2
        rm -rf feeds/base/openwrt-18.06/package/utils/adb package/feeds/base/adb
        
        rm -f key-build key-build.pub
        rm -rf package/feeds/base/batman-adv feeds/base/net/batman-adv
        rm -rf package/kernel/button-hotplug

    - name: Precise Bypass Werror
      run: |
        cd gl_sdk/sdk/1806/siflower
        find . -type f -name "CMakeLists.txt" -exec perl -pi -e 's/(^|\s)-Werror($|\s)/ /g' {} +
        find . -type f -name "Makefile" -exec perl -pi -e 's/(^|\s)-Werror($|\s)/ /g' {} +

    - name: Configure Drivers
      run: |
        cd gl_sdk/sdk/1806/siflower
        
        make defconfig
        
        sed -i 's/CONFIG_SIGNED_PACKAGES=y/# CONFIG_SIGNED_PACKAGES is not set/' .config
        
        cat <<EOF >> .config
        CONFIG_PACKAGE_luci-proto-xmm=m
        CONFIG_PACKAGE_usb-modeswitch=m
        CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=m
        CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=m
        CONFIG_PACKAGE_kmod-usb-serial-option=m
        CONFIG_PACKAGE_kmod-usb-serial=m
        CONFIG_PACKAGE_kmod-usb-serial-wwan=m
        CONFIG_PACKAGE_kmod-usb-net=m
        CONFIG_PACKAGE_kmod-usb-wdm=m
        EOF
        
        make defconfig

    - name: Compile
      run: |
        cd gl_sdk/sdk/1806/siflower
        
        export HOST_CFLAGS="-O2 -Wno-error -Wno-array-bounds -Wno-stringop-overflow"
        export TARGET_CFLAGS="-O2 -Wno-error -Wno-array-bounds -Wno-stringop-overflow"
        export FORCE_UNSAFE_CONFIGURE=1
        
        make -j$(nproc) || make -j1 V=s

    - name: Upload IPKs
      uses: actions/upload-artifact@v4
      with:
        name: sft1200-18.06-drivers
        path: |
          gl_sdk/sdk/1806/siflower/bin/**/luci-proto-xmm_*.ipk
          gl_sdk/sdk/1806/siflower/bin/**/usb-modeswitch_*.ipk
          gl_sdk/sdk/1806/siflower/bin/**/kmod-usb-*.ipk
