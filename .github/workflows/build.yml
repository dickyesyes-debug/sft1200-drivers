name: Build SFT1200 4.3.25 Drivers Real

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install Build Tools
      run: |
        sudo apt update
        sudo apt install -y build-essential ccache ecj fastjar file g++ gawk gettext git subversion libncurses5-dev libz-dev patch python3 python3-pip unzip zlib1g-dev libssl-dev libglib2.0-dev xsltproc libxml2-utils bc tmux quilt time rsync wget

    - name: Setup GL.iNet Siflower Environment
      run: |
        # 1. 複製官方真正的中央基礎構建倉庫
        git clone https://github.com builder
        cd builder
        
        # 2. 設定 Git 使用者資訊（這是官方腳本初始化時必備的，否則會報錯）
        git config --global user.email "build@gl-inet.com"
        git config --global user.name "Builder"
        
        # 3. 透過官方引導程序，指定建立 sft1200 的 OpenWrt 18.06 (Siflower) 源
        # 這會自動去下載正確的核心代碼並完成補丁修正
        python3 setup.py -c configs/templates/gl-sft1200.yml
        
        # 4. 將生成的完整 openwrt 構建目錄搬移到外層 sdk 目錄
        mv openwrt-18.06 ../sdk

    - name: Add LuCI Protocols Source
      run: |
        cd sdk
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        mkdir -p package/custom
        cd package/custom
        git clone --depth 1 https://github.com
        mv luci/protocols/luci-proto-xmm ./
        rm -rf luci

    - name: Configure Drivers and Packages
      run: |
        cd sdk
        make defconfig
        
        cat <<EOF >> .config
        CONFIG_PACKAGE_luci-proto-xmm=m
        CONFIG_PACKAGE_usb-modeswitch=m
        CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=m
        CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=m
        CONFIG_PACKAGE_kmod-usb-serial-option=m
        CONFIG_PACKAGE_kmod-usb-serial=m
        CONFIG_PACKAGE_kmod-usb-serial-wwan=m
        CONFIG_PACKAGE_kmod-usb-net=m
        CONFIG_PACKAGE_kmod-usb-wdm=m
        EOF
        
        mkdir -p tmp
        make oldconfig < /dev/null

    - name: Compile Packages
      run: |
        cd sdk
        # 開始單獨編譯
        make package/custom/luci-proto-xmm/compile V=s
        make package/utils/usb-modeswitch/compile V=s
        make package/kernel/linux/compile V=s

    - name: Collect and Upload IPKs
      uses: actions/upload-artifact@v4
      with:
        name: sft1200-4.3.25-drivers-real
        path: |
          sdk/bin/packages/mipsel_24kc/custom/luci-proto-xmm_*.ipk
          sdk/bin/packages/mipsel_24kc/base/usb-modeswitch_*.ipk
          sdk/bin/targets/siflower/gl-sft1200/packages/kmod-usb-*.ipk
