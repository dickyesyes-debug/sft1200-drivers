name: Build SFT1200 Drivers Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Install Build Tools
      run: |
        sudo apt update
        sudo apt install -y build-essential ccache ecj fastjar file g++ gawk gettext git subversion libncurses5-dev libz-dev patch python3 python3-pip python3-setuptools unzip zlib1g-dev libssl-dev libglib2.0-dev xsltproc libxml2-utils bc tmux quilt time rsync

    - name: Clone gl-infra-builder & Setup Environment
      run: |
        git clone https://github.com/gl-inet/gl-infra-builder.git
        cd gl-infra-builder
        # 建立 Siflower 18.06 的編譯樹
        python3 setup.py -p siflower-1806 -b siflower-1806

    - name: Update Feeds & Add LuCI Source
      run: |
        cd gl-infra-builder/openwrt-18.06/siflower/openwrt-18.06
        
        # 獨立抓取 luci-proto-xmm 協議
        mkdir -p package/custom
        git clone --depth 1 https://github.com/openwrt/luci.git /tmp/luci_temp
        mv /tmp/luci_temp/protocols/luci-proto-xmm package/custom/
        rm -rf /tmp/luci_temp
        
        # 更新並安裝所有依賴
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configure Drivers
      run: |
        cd gl-infra-builder/openwrt-18.06/siflower/openwrt-18.06
        
        # 生成 SFT1200 的預設核心設定
        python3 ../../../scripts/gen_config.py target_siflower_gl-sft1200
        
        # 寫入 USB 網卡與驅動模組
        cat <<EOF >> .config
        CONFIG_PACKAGE_luci-proto-xmm=m
        CONFIG_PACKAGE_usb-modeswitch=m
        CONFIG_PACKAGE_kmod-usb-net-cdc-mbim=m
        CONFIG_PACKAGE_kmod-usb-net-cdc-ncm=m
        CONFIG_PACKAGE_kmod-usb-serial-option=m
        CONFIG_PACKAGE_kmod-usb-serial=m
        CONFIG_PACKAGE_kmod-usb-serial-wwan=m
        CONFIG_PACKAGE_kmod-usb-net=m
        CONFIG_PACKAGE_kmod-usb-wdm=m
        EOF
        
        # 套用設定檔
        make defconfig

    - name: Download Sources
      run: |
        cd gl-infra-builder/openwrt-18.06/siflower/openwrt-18.06
        make download -j8

    - name: Compile
      run: |
        cd gl-infra-builder/openwrt-18.06/siflower/openwrt-18.06
        # 先嘗試全速編譯，若失敗則退回單執行緒並輸出詳細日誌
        make -j$(nproc) || make -j1 V=s

    - name: Upload IPKs
      uses: actions/upload-artifact@v4
      with:
        name: sft1200-18.06-drivers
        path: |
          gl-infra-builder/openwrt-18.06/siflower/openwrt-18.06/bin/packages/*/custom/luci-proto-xmm_*.ipk
          gl-infra-builder/openwrt-18.06/siflower/openwrt-18.06/bin/packages/*/base/usb-modeswitch_*.ipk
          gl-infra-builder/openwrt-18.06/siflower/openwrt-18.06/bin/targets/siflower/gl-sft1200/packages/kmod-usb-*.ipk
